<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ON모바일 · ON mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<style>
:root{color-scheme:only light;--bg:#f4f7ff;--card:#fff;--tx:#0f1b3d;--mut:#5d6b8c;--pri:#2b4bff;--pri2:#0fb6e6;--ln:#e1e7f7;--soft:#eaf0ff;--ok:#12b886;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR','Noto Sans','Noto Sans Myanmar',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
header .w{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px}
header .lg{justify-self:end}
.lg{position:relative}
#lgb{display:flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:700;color:var(--pri);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:5px 10px;cursor:pointer}
#lgl{display:none;position:absolute;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 30px rgba(10,20,60,.22);min-width:120px;z-index:10}
#lgl.on{display:block}
#lgl li{margin:0}
#lgl button{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-weight:700;color:var(--tx);background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
#lgl button:hover,#lgl button[aria-selected=true]{background:var(--soft)}
.fl{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2);flex:none;display:block}
#hl{height:44px;width:auto;display:block;cursor:pointer}
.mb{justify-self:start;width:40px;height:40px;border:0;background:none;color:var(--tx);font-size:26px;line-height:1;cursor:pointer;border-radius:10px}
.mb:hover{background:var(--soft)}
.drawer{position:fixed;inset:0;z-index:30;background:rgba(5,10,30,.5);display:none}
.drawer.on{display:block}
.drawer nav{background:var(--card);width:min(78%,300px);height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;flex-direction:column;gap:4px}
.drawer a{padding:14px 12px;border-radius:12px;color:var(--tx);text-decoration:none;font-weight:700}
.drawer a:hover{background:var(--soft)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:-4px}
.logo b{color:var(--pri)}
select{font:inherit;font-size:14px;font-weight:700;max-width:128px;color:var(--pri);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px 10px}
.hero{padding:26px 0 8px;text-align:center}
.lq{display:block;margin:0 auto;width:min(74%,400px);border:0;padding:0;background:none;cursor:pointer}
.lqi{position:relative}
.lqi img{width:100%;display:block}
.lqi svg{position:absolute;left:16.79%;top:11.40%;width:66.07%;height:auto;display:block}
.scan{font-weight:700;margin:10px 0 0;color:var(--tx)}
.hrow{display:flex;align-items:center;gap:16px;text-align:left;margin-top:6px}
.hrow .lq{margin:0;width:min(52%,340px);flex:none}
.htx{flex:1;min-width:0}
.hrow h1{font-size:clamp(15px,4.2vw,28px);margin:0;word-break:keep-all}
html[lang=ko] .hrow h1{white-space:nowrap;font-size:clamp(11px,3.2vw,26px)}
.h0{margin:14px 0 28px;text-align:center;line-height:1.2}
.h0 .g{display:block;margin:0 auto;font-weight:900}
.h0 .g1{width:fit-content;max-width:100%;padding:7px 18px 8px;border-radius:24px;color:#fff;font-size:clamp(20px,6.4vw,42px);letter-spacing:-.5px;background:linear-gradient(100deg,#2b4bff 0%,#6a3cff 55%,#9a3cff 100%);box-shadow:0 6px 18px rgba(70,60,255,.35),inset 0 1px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(20,10,120,.35)}
.h0 .g2{margin-top:9px;color:var(--tx);font-size:clamp(17px,5.6vw,34px);letter-spacing:-.5px}
.h0 .sep{display:inline-block;width:.3em;height:.3em;margin:0 .35em;border-radius:50%;background:#ffe45e;vertical-align:middle;position:relative;top:-.06em;box-shadow:0 0 0 .08em rgba(255,228,94,.35)}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 8px;font-size:clamp(16px,4.6vw,28px);margin:4px 0 26px;line-height:1.25}
html[lang=ko] .hd{flex-wrap:nowrap;white-space:nowrap;font-size:clamp(13px,4.8vw,34px)}
.hlogo{height:1.4em;width:auto;display:block}

.badge{display:inline-block;background:var(--soft);color:var(--pri);font-weight:700;font-size:13px;border-radius:20px;padding:4px 12px;margin:10px 0}
h1{font-size:clamp(24px,5.5vw,36px);line-height:1.25;margin:18px 0 10px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.qr{display:inline-flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 16px;box-shadow:0 8px 30px rgba(43,75,255,.12);text-align:left;margin-top:8px;max-width:100%}
.qr #qrbox{background:#fff;padding:6px;border-radius:10px;width:96px;height:96px;flex:none}
.qr #qrbox img,.qr #qrbox canvas{width:84px!important;height:84px!important}
.qr p{margin:0;font-weight:700;font-size:14px;max-width:170px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.trust div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;font-size:12px;font-weight:700;text-align:center}
.trust i{display:block;font-style:normal;height:30px;margin-bottom:4px}
.trust i svg{width:30px;height:30px;stroke:var(--pri);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slide[data-go]{cursor:pointer}
.evimg{display:block;width:100%;height:auto;border-radius:14px;margin:14px 0 0;background:var(--soft)}
.sheet.tall.full{top:0;align-items:center}
.sheet.tall.full .in{position:relative;height:auto;max-height:100%;background:transparent}
.sheet.tall.full .db{padding:0;background:transparent;display:block;flex:none;max-height:100vh;overflow:auto}
.sheet.tall.full .evimg{border-radius:0;margin:0;background:transparent}
.evx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;padding:0}
.evx svg{width:20px;height:20px}
.evno{color:var(--mut);text-align:center;padding:60px 10px;font-weight:600}
.bwrap{position:relative;margin:6px 0 4px}
.bwrap .banner{margin:0}
.barw{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;border:0;background:none;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;padding:0;-webkit-tap-highlight-color:transparent}
.barw:active{opacity:.6}
.barw svg{width:26px;height:26px}
.bl{left:6px}.br{right:6px}
.bdots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:5px;z-index:2;pointer-events:none}
.bdots i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:width .25s,background .25s}
.bdots i.on{width:22px;background:#fff}
.banner{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin:6px 0 4px}
.banner::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border-radius:18px;padding:10px 52px 16px;min-height:0;aspect-ratio:1000/317;color:#fff;display:flex;flex-direction:column;justify-content:center}
.slide h3{margin:0;font-size:22px}.slide p{margin:4px 0 0;opacity:.92}
.slide img{display:block;width:100%;height:100%;object-fit:cover;border-radius:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.bar h2{margin:0;font-size:18px}
.bar span.n{color:var(--pri)}
.tg button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--ln);background:var(--card);color:var(--mut);padding:5px 10px;cursor:pointer}
.tg button:first-child{border-radius:10px 0 0 10px}.tg button:last-child{border-radius:0 10px 10px 0}
.tg button[aria-pressed=true]{background:var(--soft);color:var(--pri)}
.plans.list{display:flex;flex-direction:column;gap:10px}
.plans.roll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.plans.roll .pc{flex:0 0 78%;max-width:300px;scroll-snap-align:start}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px 22px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pc:hover{border-color:var(--pri)}
.pc .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .nm{font-weight:800;font-size:18px;line-height:1.3}.pc .pr{font-weight:800;color:var(--pri);font-size:20px;white-space:nowrap}
.pc .pr small{font-size:12px;color:var(--mut);font-weight:600}
#filters{display:block;background:var(--card);border:1.5px solid var(--ln);border-radius:18px;padding:2px 14px;margin:14px 0}
.fh{margin:12px 0 4px;padding:11px 13px;border-radius:12px;background:var(--soft);font-weight:700;font-size:13.5px;line-height:1.7;color:var(--tx);word-break:keep-all;text-wrap:balance}
.fh b{display:inline-block;background:var(--pri);color:#fff;font-weight:800;font-size:13px;line-height:1.4;padding:1px 10px;border-radius:999px;margin-right:8px}
.grp{border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:11px 0;background:none}
#filters .grp:last-child{border-bottom:0}
.grp h4{margin:0 0 7px;font-size:14px;color:var(--tx)}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 3px 5px;margin:-3px}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-weight:800;font-size:clamp(9.5px,2.8vw,12px);white-space:nowrap;flex:0 0 auto;border:0;padding:5px clamp(7px,2.2vw,11px);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;opacity:.93}
.chip[aria-pressed=true]{opacity:1;box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--pri)}
.chip[aria-pressed=true]::before{content:"";width:4px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin:-2px 5px 0 0}
.pls{display:flex;flex-wrap:wrap;gap:4px}
.pl{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pc .pl{font-size:9px;font-weight:700;padding:1px 7px;opacity:.9}
.pc .pls{gap:3px}
.bg-white{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff}.bg-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.bg-orange{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}.bg-yellow{background:linear-gradient(135deg,#facc15,#eab308);color:#1e293b}.bg-green{background:linear-gradient(135deg,#84cc16,#65a30d);color:#0f172a}.bg-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff}.bg-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}.bg-navy{background:linear-gradient(135deg,#1e3a8a,#0f172a);color:#fff}.bg-black{background:#0f172a;color:#fff}.bg-sky{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff}
.p-sk{background:linear-gradient(135deg,#bae6fd,#7dd3fc);color:#0c4a6e}.p-kt{background:linear-gradient(135deg,#fed7aa,#fdba74);color:#7c2d12}.p-lg{background:linear-gradient(135deg,#fecaca,#fca5a5);color:#7f1d1d}.p-ska{background:linear-gradient(135deg,#bbf7d0,#86efac);color:#14532d}.p-kta{background:linear-gradient(135deg,#ddd6fe,#c4b5fd);color:#4c1d95}.p-lga{background:linear-gradient(135deg,#fbcfe8,#f9a8d4);color:#831843}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;color:var(--pri);margin-right:5px}
.row .lb{display:inline-flex;align-items:center;gap:0}.row .lb .ic{width:20px;height:20px;margin-right:8px}
.mini span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600}
.tags span{font-size:11px;font-weight:700;color:var(--mut);margin-right:6px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.sheet{position:fixed;inset:0;background:rgba(5,10,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
@media(min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:24px}}
.sheet.tall{align-items:flex-end;top:calc(61px + env(safe-area-inset-top,0px))}
.sheet.tall .dh{display:none!important}
.sheet.tall .in{display:flex;flex-direction:column;padding:0;height:100%;max-height:none;border-radius:0;overflow:hidden}
.sheet.tall .db{flex:1;overflow:auto;padding:0 20px 8px}
.sheet.tall .cls{flex:none;width:auto;margin:10px 20px calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:16px;font-size:16px}
.dn{flex:none;background:var(--pri);color:#fff;text-align:center;font-weight:800;font-size:clamp(19px,5.6vw,26px);line-height:1.3;padding:22px 16px;word-break:keep-all}
.dp{display:flex;align-items:baseline;justify-content:center;gap:14px;padding:22px 0 14px;flex-wrap:wrap}
.dp .pt{font-weight:800;font-size:clamp(15px,4.4vw,20px);padding:6px 16px;opacity:1;align-self:center}
.dp .pn{font-weight:800;font-size:clamp(40px,12.5vw,56px);line-height:1;color:var(--pri);letter-spacing:-1px}
.dp .pm{font-weight:800;font-size:clamp(17px,4.6vw,24px);color:var(--mut)}
.dr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--ln)}
.dr .lb{display:inline-flex;align-items:center;color:var(--mut);font-size:15px;font-weight:600}
.dr .lb .ic{width:22px;height:22px;margin-right:10px}
.dr .lb.k{padding-left:0}
.dr b{text-align:right;font-weight:800;font-size:15px}
.dr b .dnet{font-size:13px;font-weight:800;padding:3px 11px;margin-right:9px;vertical-align:1px;opacity:1}
.dn-note{color:var(--mut);font-size:14px;line-height:1.55;margin:22px 4px 10px}
.ic-inf{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;margin-right:10px;flex:none}
.ic-inf svg{width:14px;height:14px}
@media(min-width:700px){.sheet.tall{align-items:stretch}.sheet.tall .in{border-radius:0}.sheet.tall.full{align-items:center}}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.row b{text-align:right}
.big-pr{font-size:32px;font-weight:800;color:var(--pri)}
.cls{width:100%;margin-top:16px;font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px;background:var(--pri);color:#fff;cursor:pointer}
.info{background:var(--card);border:1px dashed var(--pri);border-radius:18px;padding:16px;margin:24px 0}
.info h3{margin:0 0 6px;color:var(--pri)}.info li{margin:4px 0}
.si{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px 18px 16px;margin:0;font-size:13.5px;line-height:1.5;color:var(--tx)}
.si h3{margin:0 0 10px;font-size:15px}
.si dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:7px 10px}
.si dt{color:var(--mut);font-weight:600}.si dd{margin:0;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.si a{color:var(--pri);text-decoration:none}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;gap:8px}
.fab a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,27,61,.28);-webkit-tap-highlight-color:transparent}
.fab a:active{transform:scale(.94)}
.fab svg{width:23px;height:23px}
.sd{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:14;width:46px;height:46px;border-radius:50%;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2b4bff,#6a3cff);color:#fff;box-shadow:0 6px 18px rgba(70,60,255,.4);animation:sdb 1.3s ease-in-out infinite;transition:opacity .25s}
.sd svg{width:24px;height:24px}
.sd.off{opacity:0;pointer-events:none}
@keyframes sdb{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,9px)}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 40px}
.pc .no{font-weight:800;font-size:18px;color:var(--pri);margin-right:2px;flex:none}
.pci{padding:0;overflow:hidden}
.pc-img{width:100%;display:block}
</style>

let bi=0,bTimer;
function buildDots(){const n=$('banner').children.length;$('bdots').innerHTML=n>1?Array.from({length:n},(_,k)=>'<i'+(k===bi?' class="on"':'')+'></i>').join(''):'';$('bprev').style.display=$('bnext').style.display=n>1?'':'none'}
function bGo(k,smooth){const b=$('banner'),n=b.children.length;if(!n)return;bi=(k+n)%n;b.scrollTo({left:b.children[bi].offsetLeft-b.offsetLeft,behavior:smooth===false?'auto':'smooth'});[...$('bdots').children].forEach((d,x)=>d.classList.toggle('on',x===bi))}
function bTick(){clearInterval(bTimer);bTimer=setInterval(()=>{if($('banner').children.length>1)bGo(bi+1)},6000)}
$('bprev').onclick=()=>{bGo(bi-1);bTick()};$('bnext').onclick=()=>{bGo(bi+1);bTick()};
let bSc;$('banner').addEventListener('scroll',()=>{clearTimeout(bSc);bSc=setTimeout(()=>{const b=$('banner');let best=0,d=1e9;[...b.children].forEach((c,x)=>{const t=Math.abs(c.offsetLeft-b.offsetLeft-b.scrollLeft);if(t<d){d=t;best=x}});if(best!==bi){bi=best;[...$('bdots').children].forEach((e,x)=>e.classList.toggle('on',x===bi))}},80)},{passive:true});
$('banner').addEventListener('touchstart',bTick,{passive:true});
bTick();
</script>
